services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: balancing
      POSTGRES_USER: balancing
      POSTGRES_PASSWORD: balancing
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ stores data in a version-specific subdirectory of this path
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balancing -d balancing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
